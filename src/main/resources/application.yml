# ===================================================================
# Spring Boot base configuration — overridden by active profile.
# ===================================================================

spring:
  application:
    name: docintelligence-catalog-service
  datasource:
    url: jdbc:postgresql://${iqkv.db.host}:${iqkv.db.port}/${iqkv.db.name}
    username: ${iqkv.db.username}
    password: ${iqkv.db.password}
  rabbitmq:
    host: ${iqkv.rabbitmq.host}
    port: ${iqkv.rabbitmq.port}
    username: ${iqkv.rabbitmq.username}
    password: ${iqkv.rabbitmq.password}
    listener:
      simple:
        # A rejected delivery must not be requeued immediately, otherwise a poison
        # tenant event loops until its 24h TTL expires. After the bounded retries
        # below the message is dead-lettered to SERVICE_DLQ for inspection.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2s
          multiplier: 2.0
          max-interval: 30s
  liquibase:
    enabled: false
    change-log: classpath:db/changelog/system/db.changelog-system.xml
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.liquibase.LiquibaseAutoConfiguration
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  ai:
    ollama:
      base-url: ${SPRING_AI_OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${SPRING_AI_OLLAMA_CHAT_OPTIONS_MODEL:llama3.2}
      embedding:
        options:
          model: ${SPRING_AI_OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

mybatis:
  mapper-locations: classpath*:mappers/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080
  forward-headers-strategy: framework
  shutdown: graceful

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

iqkv:
  db:
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:5432}
    name: ${DB_NAME:catalogservice}
    username: ${DB_USERNAME:svc_catalog_dba}
    password: ${DB_PASSWORD:svc_catalog_dba}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:svc_catalog_rmq}
    password: ${RABBITMQ_PASSWORD:svc_catalog_rmq}
  messaging:
    rabbitmq:
      # Controlled via MESSAGING_ENABLED env var; defaults to false for local safety.
      # Helm chart configmap sets this per environment (sit/uat/prd).
      enabled: ${MESSAGING_ENABLED:false}
  catalog:
    ai-search:
      # Gates the LLM query planner that turns a semantic-search query into structured
      # filters. When disabled (or when the Ollama chat model is unreachable) semantic
      # search falls back to embedding the raw query with no hard filters.
      enabled: ${CATALOG_AI_SEARCH_ENABLED:true}
    venue-ask:
      # Catalog-native chat / RAG over the tenant's own venue data. When disabled, or when the
      # Ollama chat model is unreachable, the ask endpoints answer answered=false with the
      # retrieved sources and the chat endpoints degrade to a canned reply.
      enabled: ${CATALOG_VENUE_ASK_ENABLED:true}
      system-prompt: ${CATALOG_VENUE_ASK_SYSTEM_PROMPT:You are the venue catalog assistant for a venue team. Answer using only the CONTEXT provided. If the context does not contain the answer, say you do not know. Never invent venue facts. Cite sources by their label when you use them.}
      # Selectable persona overlays. The client sends one of these keys with a turn; only keys
      # configured here resolve, so client input never reaches the system message.
      personas:
        concierge: ${CATALOG_VENUE_ASK_PERSONA_CONCIERGE:Adopt a warm, concierge tone. Lead with what the venue offers and suggest a helpful next step when it fits.}
        compliance: ${CATALOG_VENUE_ASK_PERSONA_COMPLIANCE:Answer strictly from the CONTEXT. If the context does not contain the answer, say you do not know. Do not speculate or use outside knowledge.}
      max-input-chars: ${CATALOG_VENUE_ASK_MAX_INPUT_CHARS:4000}
      max-output-tokens: ${CATALOG_VENUE_ASK_MAX_OUTPUT_TOKENS:1024}
      temperature: ${CATALOG_VENUE_ASK_TEMPERATURE:0.2}
      default-model: ${CATALOG_VENUE_ASK_MODEL:${SPRING_AI_OLLAMA_CHAT_OPTIONS_MODEL:llama3.2}}
      max-context-chars: ${CATALOG_VENUE_ASK_MAX_CONTEXT_CHARS:12000}
      # Earlier turns of a chat session replayed as memory, and the size they may add to the prompt.
      max-history-messages: ${CATALOG_VENUE_ASK_MAX_HISTORY_MESSAGES:8}
      max-history-chars: ${CATALOG_VENUE_ASK_MAX_HISTORY_CHARS:4000}
      guard:
        # Prompt-injection guard for chat / ask input and the output leak check.
        enabled: ${CATALOG_VENUE_ASK_GUARD_ENABLED:true}
  objectstorage:
    # S3-compatible endpoint — MinIO in SIT/UAT, https://s3.amazonaws.com for AWS S3 in prod.
    endpoint: ${OBJECTSTORAGE_ENDPOINT:http://localhost:9000}
    # Public URL used to rewrite presigned URLs returned to external clients.
    # Leave blank to return presigned URLs unchanged (local dev, AWS S3).
    public-endpoint: ${OBJECTSTORAGE_PUBLIC_ENDPOINT:}
    access-key: ${OBJECTSTORAGE_ACCESS_KEY:iqkv}
    secret-key: ${OBJECTSTORAGE_SECRET_KEY:iqkv_password}
    bucket-name: ${OBJECTSTORAGE_BUCKET_NAME:catalog-assets}
    region: ${OBJECTSTORAGE_REGION:us-east-1}
    ssl: ${OBJECTSTORAGE_SSL:false}
    upload:
      max-file-size-bytes: ${OBJECTSTORAGE_UPLOAD_MAX_FILE_SIZE_BYTES:20971520}
      presigned-url-expiration-minutes: ${OBJECTSTORAGE_UPLOAD_PRESIGNED_URL_EXPIRATION_MINUTES:60}
      allowed-mime-types: ${OBJECTSTORAGE_UPLOAD_ALLOWED_MIME_TYPES:application/pdf,image/jpeg,image/png,image/webp,image/tiff,text/plain,text/markdown,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document}
  platform:
    # Platform-wide operational mode: MULTI_TENANT (default) or SINGLE_TENANT.
    # Must be the same value across all core services (IAM, Billing, CMS, etc.).
    rollout-mode: ${ROLLOUT_MODE:MULTI_TENANT}
  tenancy:
    # Default tenant key for SINGLE_TENANT mode (optional).
    # Format: 8-character NanoID using alphabet [a-z0-9], e.g. abc12345
    default-tenant-key: platform
    # Display name for the default tenant in SINGLE_TENANT mode
    default-tenant-name: ${DEFAULT_TENANT_NAME:Acme Corp.}
    schema-prefix: t_
    default-schema: public
    provisioning-timeout: PT10M
  liquibase:
    tenant-runner-enabled: true
    system-change-log: db/changelog/system/db.changelog-system.xml
    tenant-change-log: db/changelog/tenant/db.changelog-tenant.xml
  billing:
    # Billing service base URL used for quota / plan enforcement
    service-url: ${BILLING_SERVICE_URI:http://foundation-billing-service}
    # How often the plan catalog cache is refreshed (ISO-8601 duration)
    plan-refresh-interval: ${BILLING_PLAN_REFRESH_INTERVAL:PT10M}
  auth:
    jwt:
      # --- Deployed (K8s) — set JWT_JWKS_URI in Helm values / K8s configmap ---
      # JWKS URI of the IAM service. Keys are fetched, cached, and refreshed automatically
      # when a JWT carries an unknown kid — enabling transparent key rotation.
      # Leave blank (or unset JWT_JWKS_URI) to fall back to public-key-path below.
      # Example: http://foundation-iam-service/.well-known/jwks.json
      jwks-uri: ${JWT_JWKS_URI:}
      # --- Local development and tests — ignored when jwks-uri is set ---
      # Path to the RSA public key PEM. Accepts classpath: (tests) or file: resources.
      public-key-path: ${JWT_PUBLIC_KEY_PATH:classpath:keys/public.pem}

git:
  build_time: "@git.build.time@"
  commit: "@git.commit.id.abbrev@"
info:
  app:
    build_time: ${git.build_time}
    description: "@project.description@"
    git_commit: ${git.commit}
    name: "@project.name@"
    version: "@project.version@"
